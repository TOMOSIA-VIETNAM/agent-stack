# Strict baseline. Prefer very_good_analysis; fall back to flutter_lints (see commented line).
# Check the package's minimum SDK against your pubspec before pinning.
include: package:very_good_analysis/analysis_options.yaml
# include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "lib/generated/**"
    - "build/**"
  errors:
    unawaited_futures: error
    use_build_context_synchronously: error
    cancel_subscriptions: error
    # NOTE: do not set `deprecated_member_use: ignore`; it hides migration debt.

linter:
  rules:
    always_use_package_imports: true
    avoid_print: true
    avoid_dynamic_calls: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    directives_ordering: true
    unawaited_futures: true
    # very_good_analysis enables public_member_api_docs; noisy for apps, so off. Enable only for shared/published packages.
    public_member_api_docs: false
    # close_sinks is not enabled by VGA (false positives); leave it off.
    # If you use `prefer_relative_imports`, disable always_use_package_imports (they conflict).
