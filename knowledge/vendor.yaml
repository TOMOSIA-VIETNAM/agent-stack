# Skills imported from other repositories.
#
# Each source is pinned to a full commit SHA: the checkout is reproducible, an
# upstream force-push cannot change what a previous run produced, and updating
# means changing the SHA here in a reviewable commit.
#
# The fetch happens once per SHA into ~/.cache/open-aidd. If it cannot complete,
# the run fails — open-aidd never emits a partial rule set silently.
version: 1

sources:
  agent-skills:
    repo: https://github.com/addyosmani/agent-skills.git
    ref: a120596f6d7ff9b967a3f5e0331ea911376ee5ef
    license: MIT
    license_file: LICENSE
    copyright: Copyright (c) Addy Osmani
    path: skills
    layer: global
    priority: 20
