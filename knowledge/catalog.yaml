# Framework graph for agent-stack.
#
# Every entry here is a framework, because a framework is the only thing an
# operator selects (idea.md §2). There is no `kind` field: it would be the same
# word on every row.
#
# A framework listed here without any rule or skill in knowledge/ is still
# valid: the validator reports it as "no content yet" instead of failing.
#
# Versions are deliberately absent. Selection is by framework alone, so a rule
# applies to a framework, not to one of its releases.
#
# `requires` and `conflicts_with` still exist and are still enforced — the
# resolver expands the first transitively and never settles the second on its
# own — but no entry needs them yet.
version: 1

technologies:
  rails:
    name: Ruby on Rails

  laravel:
    name: Laravel
